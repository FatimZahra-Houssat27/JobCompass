<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1b2631}
      .s{font-size:12px;fill:#37474f}
      .x{font-size:11px;fill:#546e7a}
      .done{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}
      .todo{fill:#f5f5f5;stroke:#9e9e9e;stroke-width:2;stroke-dasharray:7 5}
      .zone{fill:none;stroke:#90a4ae;stroke-width:1.5;stroke-dasharray:4 4}
      .f{stroke:#37474f;stroke-width:2;fill:none;marker-end:url(#a)}
      .fg{stroke:#9e9e9e;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#g)}
      .lbl{font-size:11px;fill:#37474f;font-style:italic}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2631">JobCompass — Architecture du pipeline Big Data</text>
  <text x="640" y="56" text-anchor="middle" class="s">Cluster simulé avec Docker Compose (réseau « bigdata ») — recommandation d'offres d'emploi</text>

  <!-- Zone cluster -->
  <rect x="20" y="72" width="1240" height="610" rx="14" class="zone"/>
  <text x="34" y="92" class="x">docker-compose.yml — réseau Docker « bigdata »</text>

  <!-- 1 Sources -->
  <rect x="40" y="130" width="170" height="120" rx="10" class="done"/>
  <text x="125" y="155" text-anchor="middle" class="t">Données Djinni</text>
  <text x="125" y="177" text-anchor="middle" class="s">Hugging Face (MIT)</text>
  <text x="125" y="197" text-anchor="middle" class="s">141 897 offres</text>
  <text x="125" y="215" text-anchor="middle" class="s">210 250 candidats</text>
  <text x="125" y="235" text-anchor="middle" class="x">Parquet · ./data</text>

  <!-- 2 Producteurs -->
  <rect x="250" y="120" width="190" height="140" rx="10" class="done"/>
  <text x="345" y="145" text-anchor="middle" class="t">Producteurs Python</text>
  <text x="345" y="167" text-anchor="middle" class="s">producer_offers.py</text>
  <text x="345" y="185" text-anchor="middle" class="s">producer_interactions.py</text>
  <text x="345" y="203" text-anchor="middle" class="s">+ generator.py</text>
  <text x="345" y="223" text-anchor="middle" class="x">simulation view/save/apply</text>
  <text x="345" y="241" text-anchor="middle" class="x">modes history · live</text>

  <!-- 3 Kafka -->
  <rect x="480" y="110" width="210" height="160" rx="10" class="done"/>
  <text x="585" y="135" text-anchor="middle" class="t">Apache Kafka 3.7 (KRaft)</text>
  <rect x="498" y="150" width="174" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="585" y="168" text-anchor="middle" class="s">topic job-offers</text>
  <text x="585" y="183" text-anchor="middle" class="x">3 partitions · clé job_id</text>
  <rect x="498" y="198" width="174" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="585" y="216" text-anchor="middle" class="s">topic candidate-interactions</text>
  <text x="585" y="231" text-anchor="middle" class="x">3 partitions · clé candidate_id</text>
  <text x="585" y="258" text-anchor="middle" class="x">kafka:9092 · localhost:29092</text>

  <!-- 4 Spark cluster -->
  <rect x="740" y="100" width="500" height="200" rx="10" class="done"/>
  <text x="990" y="124" text-anchor="middle" class="t">Apache Spark 3.5.1 — Standalone</text>
  <rect x="760" y="138" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="830" y="162" text-anchor="middle" class="s">spark-master</text>
  <text x="830" y="180" text-anchor="middle" class="x">:7077 · UI :8080</text>
  <rect x="920" y="138" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="990" y="162" text-anchor="middle" class="s">spark-worker-1</text>
  <text x="990" y="180" text-anchor="middle" class="x">1 cœur · 768 Mo</text>
  <rect x="1080" y="138" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="1150" y="162" text-anchor="middle" class="s">spark-worker-2</text>
  <text x="1150" y="180" text-anchor="middle" class="x">1 cœur · 768 Mo</text>
  <rect x="760" y="212" width="225" height="74" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="872" y="234" text-anchor="middle" class="s">Structured Streaming</text>
  <text x="872" y="252" text-anchor="middle" class="x">lecture Kafka (testé ✔)</text>
  <text x="872" y="270" text-anchor="middle" class="x">archivage HDFS ✔ · inférence</text>
  <rect x="995" y="212" width="225" height="74" rx="6" class="todo"/>
  <text x="1107" y="234" text-anchor="middle" class="s">Batch : Spark SQL + Spark ML</text>
  <text x="1107" y="252" text-anchor="middle" class="x">indicateurs · ALS · TF-IDF</text>
  <text x="1107" y="270" text-anchor="middle" class="x">popularité (référence)</text>

  <!-- 5 HDFS -->
  <rect x="740" y="360" width="500" height="150" rx="10" class="done"/>
  <text x="990" y="384" text-anchor="middle" class="t">HDFS 3.3.6 — réplication = 2</text>
  <rect x="760" y="398" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="830" y="422" text-anchor="middle" class="s">namenode</text>
  <text x="830" y="440" text-anchor="middle" class="x">:8020 · UI :9870</text>
  <rect x="920" y="398" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="990" y="422" text-anchor="middle" class="s">datanode1</text>
  <text x="990" y="440" text-anchor="middle" class="x">volume dn1-data</text>
  <rect x="1080" y="398" width="140" height="60" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="1150" y="422" text-anchor="middle" class="s">datanode2</text>
  <text x="1150" y="440" text-anchor="middle" class="x">volume dn2-data</text>
  <text x="990" y="482" text-anchor="middle" class="x">/jobcompass/raw (historique Parquet) · /jobcompass/reference · /jobcompass/models</text>
  <text x="990" y="498" text-anchor="middle" class="x">volume nn-data (NameNode) — un volume persistant distinct par nœud</text>

  <!-- 6 Restitution -->
  <rect x="380" y="400" width="210" height="110" rx="10" class="todo"/>
  <text x="485" y="428" text-anchor="middle" class="t">Base de restitution</text>
  <text x="485" y="450" text-anchor="middle" class="s">PostgreSQL</text>
  <text x="485" y="470" text-anchor="middle" class="x">recommandations temps réel</text>
  <text x="485" y="488" text-anchor="middle" class="x">indicateurs batch</text>

  <rect x="60" y="400" width="210" height="110" rx="10" class="todo"/>
  <text x="165" y="428" text-anchor="middle" class="t">Tableau de bord</text>
  <text x="165" y="450" text-anchor="middle" class="s">Streamlit (bonus)</text>
  <text x="165" y="470" text-anchor="middle" class="x">actualisation automatique</text>

  <!-- Flux réalisés -->
  <path d="M210,190 L248,190" class="f"/>
  <path d="M440,190 L478,190" class="f"/>
  <text x="459" y="180" text-anchor="middle" class="lbl">JSON</text>
  <path d="M690,190 L738,240" class="f"/>
  <text x="706" y="204" class="lbl">readStream</text>

  <!-- Voie froide -->
  <path d="M850,288 L850,396" class="f"/>
  <text x="860" y="330" class="lbl">voie froide : archivage (✔)</text>
  <text x="860" y="345" class="lbl">writeStream Parquet</text>
  <path d="M1130,396 L1130,288" class="fg"/>
  <text x="1140" y="340" class="lbl">lecture historique</text>
  <text x="1140" y="355" class="lbl">+ modèle sauvegardé</text>

  <!-- Voie chaude / restitution -->
  <path d="M760,268 C640,300 600,360 560,398" class="fg"/>
  <text x="600" y="330" class="lbl">voie chaude : prédictions</text>
  <path d="M1000,512 C980,560 620,560 560,512" class="fg"/>
  <text x="780" y="570" text-anchor="middle" class="lbl">indicateurs batch (JDBC)</text>
  <path d="M378,455 L272,455" class="fg"/>

  <!-- Légende -->
  <rect x="40" y="600" width="1200" height="66" rx="8" fill="#fafafa" stroke="#cfd8dc"/>
  <rect x="60" y="618" width="34" height="20" rx="4" class="done"/>
  <text x="104" y="633" class="s">Réalisé (livrable 1 : cluster + ingestion Kafka → HDFS)</text>
  <rect x="380" y="618" width="34" height="20" rx="4" class="todo"/>
  <text x="424" y="633" class="s">À venir (semaines 2 à 4)</text>
  <path d="M630,628 L680,628" class="f"/><text x="690" y="633" class="s">Flux opérationnel</text>
  <path d="M840,628 L890,628" class="fg"/><text x="900" y="633" class="s">Flux prévu</text>
  <text x="60" y="656" class="x">Ressources : PC 8 Go (WSL2 5 Go + swap 4 Go) · JVM Hadoop 256 Mo · démons Spark 256 Mo · exécuteurs 512 Mo · Kafka 384 Mo</text>
  <text x="640" y="720" text-anchor="middle" class="x">Images fixées : apache/hadoop:3.3.6 · apache/spark:3.5.1 · apache/kafka:3.7.0 · python:3.11-slim</text>
</svg>
